name: Refresh Portal Dashboard Data

on:
  # Scheduling is now handled externally by cron-job.org calling this via the
  # GitHub API (workflow_dispatch) every 15 minutes — GitHub's own native
  # `schedule:` trigger proved too unreliable (over an hour with zero fires
  # in testing) and, worse, running it alongside cron-job.org risked two
  # overlapping runs hitting ClickUp's API at once, which is the likely
  # cause of the random failures. Do not re-add a `schedule:` block here
  # unless cron-job.org is also removed — don't run both at once.
  workflow_dispatch: {} # also lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch ClickUp data and rebuild data.json
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: node scripts/refresh-data.js

      - name: Commit and push if changed
        run: |
          git config user.name "portal-dashboard-bot"
          git config user.email "actions@github.com"
          git add data.json history.json
          git diff --cached --quiet || git commit -m "Refresh portal data [automated]"
          git push
