name: Refresh Portal Dashboard Data

on:
  schedule:
    # Every 15 minutes, offset to :07/:22/:37/:52 instead of the round numbers
    # (:00/:15/:30/:45). GitHub's scheduler is "best effort" and can be delayed,
    # especially right after a workflow is created — and delays are worse at
    # exact round-number minutes since huge numbers of other repos worldwide
    # schedule there too. Offsetting doesn't guarantee punctuality, but it
    # avoids the worst of that pile-up.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {} # lets you trigger a manual run from the Actions tab, useful for testing

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch ClickUp data and rebuild data.json
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: node scripts/refresh-data.js

      - name: Commit and push if changed
        run: |
          git config user.name "portal-dashboard-bot"
          git config user.email "actions@github.com"
          git add data.json history.json
          git diff --cached --quiet || git commit -m "Refresh portal data [automated]"
          git push
